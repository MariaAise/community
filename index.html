<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShareRide - Neighbour Commute Sharing</title>
    <script>
      // Restore SPA route after 404.html redirect on GitHub Pages
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          var base = '/community';
          var path = redirect.startsWith(base) ? redirect.slice(base.length) : redirect;
          if (path && path !== '/') {
            history.replaceState(null, '', base + path);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
